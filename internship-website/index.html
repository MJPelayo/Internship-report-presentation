<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Presentation - Madisco</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0B3B24 0%, #1A5D3A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .logo {
            width: 150px;
            height: 150px;
            background: rgba(165,214,165,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #C8E6A0;
        }

        p {
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .slide-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 40px auto;
        }

        .slide-link {
            background: rgba(165,214,165,0.2);
            border: 1px solid rgba(165,214,165,0.3);
            border-radius: 10px;
            padding: 15px 5px;
            text-decoration: none;
            color: white;
            transition: all 0.3s;
            text-align: center;
        }

        .slide-link:hover {
            background: rgba(165,214,165,0.4);
            transform: translateY(-3px);
        }

        .start-btn {
            background: #A5D6A5;
            color: #0B3B24;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s;
        }

        .start-btn:hover {
            transform: scale(1.05);
            background: #C8E6A0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌿</div>
        <h1>Madisco IT Internship</h1>
        <p>Final Presentation by Marlon Anthony Pelayo</p>
        
        <a href="page1.html" class="start-btn">▶ START PRESENTATION</a>
        
        <div class="slide-grid">
            <a href="page1.html" class="slide-link">1</a>
            <a href="page2.html" class="slide-link">2</a>
            <a href="page3.html" class="slide-link">3</a>
            <a href="page4.html" class="slide-link">4</a>
            <a href="page5.html" class="slide-link">5</a>
            <a href="page6.html" class="slide-link">6</a>
            <a href="page7.html" class="slide-link">7</a>
            <a href="page8.html" class="slide-link">8</a>
            <a href="page9.html" class="slide-link">9</a>
            <a href="page10.html" class="slide-link">10</a>
            <a href="page11.html" class="slide-link">11</a>
            <a href="page12.html" class="slide-link">12</a>
            <a href="page13.html" class="slide-link">13</a>
        </div>
    </div>
</body>
</html>

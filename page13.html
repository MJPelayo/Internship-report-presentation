<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 13 - Thank You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0B3B24 0%, #1A5D3A 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .slide-container {
            max-width: 1200px;
            width: 90%;
            margin: 40px auto;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
        }

        .header-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: rgba(165,214,165,0.3);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
            font-size: 0.9rem;
        }

        .nav-btn:hover {
            background: rgba(165,214,165,0.6);
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: pulse 1.5s ease infinite;
            color: #C8E6A0;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #A5D6A5;
        }

        .question {
            font-size: 1.2rem;
            margin: 30px 0;
        }

        .celebrate-btn {
            background: #A5D6A5;
            color: #0B3B24;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s;
            margin: 20px 0;
        }

        .celebrate-btn:hover {
            transform: scale(1.05);
            background: #C8E6A0;
        }

        .page-indicator {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            .subtitle {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="confettiCanvas"></canvas>
    <div class="slide-container">
        <div class="header-row">
            <div class="nav-buttons">
                <a href="page12.html" class="nav-btn">← Previous</a>
            </div>
        </div>
        <h1>Thank You</h1>
        <div class="subtitle">IT Support Internship at Madisco Company Ltd.</div>
        <div class="question">Any Questions?</div>
        <button class="celebrate-btn" onclick="startConfetti()">🎉 Celebrate! 🎉</button>
    </div>
    <div class="page-indicator">Page 13 of 13</div>

    <script>
        function startConfetti() {
            var canvas = document.getElementById('confettiCanvas');
            var ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            var particles = [];
            for (var i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 3,
                    speedY: Math.random() * 5 + 3,
                    speedX: (Math.random() - 0.5) * 3,
                    color: 'hsl(' + (Math.random() * 360) + ', 70%, 60%)'
                });
            }
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                var active = false;
                
                particles.forEach(function(p) {
                    p.y += p.speedY;
                    p.x += p.speedX;
                    if (p.y < canvas.height) active = true;
                    if (p.y > canvas.height) p.y = -20;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.x < 0) p.x = canvas.width;
                    
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                
                if (active) requestAnimationFrame(animate);
            }
            
            animate();
            setTimeout(function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }, 5000);
        }
    </script>
</body>
</html>

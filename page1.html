<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 1 - Internship Final Report</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0B3B24 0%, #1A5D3A 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .slide-container {
            max-width: 1200px;
            width: 90%;
            margin: 40px auto;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
        }

        .title {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: fadeInDown 1s ease;
            color: #C8E6A0;
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #A5D6A5;
            animation: fadeInUp 1s ease 0.2s both;
        }

        .author {
            font-size: 1.2rem;
            margin-bottom: 10px;
            animation: fadeInUp 1s ease 0.4s both;
        }

        .course {
            font-size: 1rem;
            margin-bottom: 10px;
            opacity: 0.8;
            animation: fadeInUp 1s ease 0.6s both;
        }

        .duration {
            font-size: 1rem;
            margin-bottom: 40px;
            opacity: 0.8;
            animation: fadeInUp 1s ease 0.8s both;
        }

        .start-btn {
            background: #A5D6A5;
            color: #0B3B24;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: fadeInUp 1s ease 1s both;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(165,214,165,0.4);
            background: #C8E6A0;
        }

        .nav-buttons {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .nav-btn {
            background: rgba(165,214,165,0.3);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }

        .nav-btn:hover {
            background: rgba(165,214,165,0.6);
        }

        .page-indicator {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .image {
            width: 100%;
            max-width: 200px;
            height: auto;
            margin: 20px auto;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="nav-buttons">
        <span></span>
        <a href="page2.html" class="nav-btn">Next →</a>
    </div>
    <div class="slide-container">
        <div class="image">
            <img src="images/Madisco logo.png" alt="Madisco Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='[Madisco Logo Placeholder - Add your logo to images folder]'">
        </div>
        <h1 class="title">Internship Final Report</h1>
        <div class="subtitle">IT Support Internship at Madisco Company Ltd.</div>
        <div class="author">by Marlon Anthony Pelayo</div>
        <div class="course">CMPS2992 - Work Experience</div>
        <div class="duration">10 Weeks</div>
        <button class="start-btn" onclick="location.href='page2.html'">BEGIN PRESENTATION →</button>
    </div>
    <div class="page-indicator">Page 1 of 13</div>
</body>
</html>
